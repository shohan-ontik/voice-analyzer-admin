services:
  admin:
    build: .
    restart: unless-stopped
    ports:
      - "3003:3001"
    env_file:
      - path: .env
        required: false
    environment:
      # Trust the self-signed cert used by *.staging.internal
      NODE_EXTRA_CA_CERTS: /certs/staging-internal.pem
    volumes:
      - ./certs:/certs:ro
    extra_hosts:
      - "pitch-perfect-backend.staging.internal:100.87.196.60"
